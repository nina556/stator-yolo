[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stator-yolo"
version = "0.1.0"
description = "Jetson RealSense/CSI YOLO workflow for stator detection."
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3.0",
  "opencv-python>=4.8.0",
  "albumentations>=1.4.0",
  "PyYAML>=6.0.1",
  "tqdm>=4.66.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
realsense = ["pyrealsense2"]

[project.scripts]
stator-yolo = "stator_yolo.cli:main"
stator-yolo-web = "stator_yolo.web:main"
stator-yolo-env = "stator_yolo.env_check:main"

[tool.setuptools.packages.find]
include = ["stator_yolo*", "scripts*"]

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stator YOLO 标注台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">STATOR · DATASET STUDIO</p>
      <h1>定子视觉标注台</h1>
    </div>
    <div class="header-actions">
      <button id="workflowButton">数据与训练</button>
      <div class="status"><span id="statusDot"></span><span id="status">正在连接…</span></div>
    </div>
  </header>

  <main>
    <aside>
      <section class="panel intro">
        <p class="section-label">数据进度</p>
        <div class="progress-row"><strong id="progress">0 / 0</strong><span>已标注</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </section>

      <section class="panel">
        <label class="upload">
          <input id="uploadInput" type="file" accept="image/*" multiple>
          <span>＋ 导入图片</span>
          <small>JPG、PNG、WEBP、BMP</small>
        </label>
      </section>

      <section class="panel image-list-panel">
        <div class="panel-title">
          <span>图片列表</span>
          <button id="refreshButton" class="icon-button" title="刷新">↻</button>
        </div>
        <div id="imageList" class="image-list"></div>
      </section>
    </aside>

    <section class="workspace">
      <div class="toolbar">
        <div>
          <span class="tool-hint">按住鼠标拖拽框选定子</span>
          <span id="imageMeta"></span>
        </div>
        <div class="actions">
          <button id="deleteButton" class="danger">删除图片</button>
          <button id="undoButton">撤销</button>
          <button id="clearButton">清空</button>
          <button id="saveButton" class="primary">保存标签</button>
          <button id="saveNextButton" class="accent">保存并下一张 →</button>
        </div>
      </div>
      <div id="stage" class="stage">
        <canvas id="canvas"></canvas>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">▣</div>
          <h2>导入图片开始标注</h2>
          <p>框选结果将保存为标准 YOLO 标签格式。</p>
        </div>
      </div>
      <footer>
        <button id="prevButton">← 上一张</button>
        <span id="position">尚未选择图片</span>
        <button id="nextButton">下一张 →</button>
      </footer>
    </section>
  </main>
  <section id="workflowPanel" class="workflow-panel" hidden>
    <div class="workflow-head">
      <div>
        <p class="eyebrow">WEB WORKFLOW</p>
        <h2>数据与训练</h2>
      </div>
      <button id="closeWorkflowButton">关闭</button>
    </div>

    <div id="datasetStats" class="stats-grid"></div>

    <div class="workflow-section">
      <h3>数据集处理</h3>
      <p>按顺序检查标签、划分训练集，再按需增强训练图片。</p>
      <div class="workflow-actions">
        <button data-job="/api/dataset/validate">检查标签</button>
        <button data-job="/api/dataset/split">划分数据集 8:1:1</button>
        <label>增强份数 <input id="augmentCopies" type="number" min="1" max="10" value="2"></label>
        <button id="augmentButton">增强训练集</button>
      </div>
    </div>

    <div class="workflow-section">
      <h3>训练 YOLOv8n</h3>
      <div class="workflow-actions">
        <label>轮数 <input id="epochsInput" type="number" min="1" max="1000" value="100"></label>
        <label>批量 <input id="batchInput" type="number" min="1" max="128" value="8"></label>
        <label>图片尺寸
          <select id="imageSizeInput">
            <option>416</option><option selected>640</option><option>768</option><option>960</option>
          </select>
        </label>
        <button id="trainButton" class="primary">开始训练</button>
        <button id="stopJobButton" class="danger">停止任务</button>
      </div>
    </div>

    <div class="workflow-section job-section">
      <div class="panel-title"><span id="jobTitle">任务日志</span><span id="jobState">空闲</span></div>
      <pre id="jobLog">尚未运行任务。</pre>
    </div>
  </section>
  <script src="/app.js"></script>
</body>
</html>
